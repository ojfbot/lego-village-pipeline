  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2f77d039-95d8-46a0-849c-66688d63194e\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"33bddabf-db0e-4197-b970-b601285b887a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"80e45be0-b20a-4cd5-9995-7d3727048c56\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* Drafting Table — LEGO Village Planner token base (lv base layer)\n   CONTRAST CONTRACT (DEC-023, HANDOFF-LEGO-PIPE-014 §2): every *text* token below must read ≥ 4.5:1 on --dt-sheet in its theme.\n   Text tokens: ink muted accent accent-deep pass prov prov-deep block block-deep info info-deep unres unres-ink.\n   Fill-only tokens (no contrast claim): *-bg grid grid-mid layer-* shadow. --dt-unres IS a text token (operator call 2026-09-17).\n   Enforced by dt/check-contrast.mjs — run it before shipping a token change. */\n:root{\n--dt-bg:#F6F2E9;--dt-grid:#22303C0A;--dt-grid-mid:#22303C14;--dt-sheet:#FDFBF5;--dt-ink:#22303C;--dt-muted:#5E6B76;\n--dt-accent:#B84F2B;--dt-accent-deep:#8F3B20;\n--dt-pass:#2E6B4F;--dt-pass-bg:#E7EFE9;\n--dt-prov:#8F660E;--dt-prov-deep:#6E4D0C;--dt-prov-bg:#F5EDD8;\n--dt-block:#C0392B;--dt-block-deep:#A32B21;--dt-block-bg:#F9E9E4;\n--dt-info:#3D6B9E;--dt-info-deep:#33587E;--dt-info-bg:#E7EDF4;\n--dt-unres:#5C6E82;--dt-unres-ink:#5E6B76;\n--dt-layer-structure:#22303C;--dt-layer-transport:#B84F2B;--dt-layer-landscape:#5E7D4E;--dt-layer-story:#7E5A8C;--dt-layer-electrical:#8C6D1F;\n--dt-shadow:4px 4px 0 #B84F2B3A,8px 8px 0 #3D6B9E1F;--dt-btn-shadow:2px 2px 0 var(--dt-accent),4px 4px 0 #3D6B9E4D;--dt-on-ink:#FDFBF5;\n--dt-r-fillet:3px;--dt-r-btn:4px;--dt-r-card:4px 18px 4px 4px;--dt-r-pill:999px;\n}\nbody.dt-blueprint{color-scheme:dark;\n--dt-bg:#13202E;--dt-grid:#E4E9EE10;--dt-grid-mid:#E4E9EE1C;--dt-sheet:#1B2A3B;--dt-ink:#E4E9EE;--dt-muted:#93A5B5;\n--dt-accent:#E0754A;--dt-accent-deep:#EC9067;\n--dt-pass:#63C494;--dt-pass-bg:#1B3629;\n--dt-prov:#D9A73E;--dt-prov-deep:#E3BC67;--dt-prov-bg:#2E2716;\n--dt-block:#E06552;--dt-block-deep:#F08B7B;--dt-block-bg:#3A2220;\n--dt-info:#7FA8D9;--dt-info-deep:#A3C2E8;--dt-info-bg:#1D2E42;\n--dt-unres:#8598AC;--dt-unres-ink:#93A5B5;\n--dt-layer-structure:#E4E9EE;--dt-layer-transport:#E0754A;--dt-layer-landscape:#8FB07E;--dt-layer-story:#B08CC4;--dt-layer-electrical:#C9A94E;\n--dt-shadow:4px 4px 0 #E0754A42,8px 8px 0 #7FA8D92E;--dt-btn-shadow:2px 2px 0 var(--dt-accent),4px 4px 0 #7FA8D966;--dt-on-ink:#13202E;\n}\nbody{color-scheme:light;margin:0;background:var(--dt-bg);background-image:linear-gradient(var(--dt-grid) 1px,transparent 1px),linear-gradient(90deg,var(--dt-grid) 1px,transparent 1px);background-size:24px 24px;font-family:'Libre Franklin',sans-serif;color:var(--dt-ink);transition:background-color .25s}\na{color:var(--dt-accent-deep)}a:hover{color:var(--dt-accent)}\nbutton:hover{opacity:.88}button:active{opacity:.75}\n:focus-visible{outline:2px solid var(--dt-accent);outline-offset:2px}\ninput[type=number]{appearance:auto;-webkit-appearance:auto}\ninput[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}\n@keyframes dtChangeA{0%{background-color:color-mix(in oklch,var(--dt-accent) 26%,transparent);box-shadow:0 0 0 2px color-mix(in oklch,var(--dt-accent) 40%,transparent)}100%{background-color:transparent;box-shadow:0 0 0 0 transparent}}\n@keyframes dtChangeB{0%{background-color:color-mix(in oklch,var(--dt-accent) 26%,transparent);box-shadow:0 0 0 2px color-mix(in oklch,var(--dt-accent) 40%,transparent)}100%{background-color:transparent;box-shadow:0 0 0 0 transparent}}\n@keyframes dtSnapPulse{0%{r:10;opacity:.9}100%{r:26;opacity:0}}\n/* landing flash — fired by dt/landing.js on the element a #anchor points at (DEC-033) */\n@keyframes dtLand{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--dt-accent) 0%,transparent);outline:3px solid var(--dt-accent);outline-offset:6px}20%{box-shadow:0 0 0 10px color-mix(in oklch,var(--dt-accent) 28%,transparent);outline-offset:2px}100%{box-shadow:0 0 0 0 transparent;outline:3px solid transparent;outline-offset:2px}}\n.dt-landing{animation:dtLand 1.6s ease-out 1;border-radius:var(--dt-r-fillet)}\n@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}\n<\u002Fstyle>\n<style>@keyframes dtStampIn{0%{transform:rotate(-14deg) scale(1.6);opacity:0}60%{transform:rotate(-3deg) scale(0.96);opacity:1}100%{transform:rotate(-3deg) scale(1)}} @keyframes dtWand{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}} button:disabled{opacity:.45;cursor:not-allowed}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1240px;margin:0 auto;padding:28px 28px 48px\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--dt-ink);padding-bottom:10px;gap:16px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n      <div style=\"font-family:'Spectral',serif;font-size:19px;font-weight:700;font-style:italic;flex:none;white-space:nowrap\">F-01 — Family Workbench<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--dt-muted);letter-spacing:0.08em\">FAMILY POSTURE STUDY · TABLET · J11 + O4 · MOCK<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <a href=\"Hub.dc.html\" style=\"font-family:'Azeret Mono',monospace;font-size:11px;text-decoration:none;white-space:nowrap\">← HUB<\u002Fa>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-pressed=\"{{ dark }}\" style=\"font-family:'Azeret Mono',monospace;font-size:11px;font-weight:600;background:transparent;color:var(--dt-ink);border:1.5px solid var(--dt-ink);padding:6px 12px;cursor:pointer;border-radius:var(--dt-r-btn)\">{{ themeLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:var(--dt-info-bg);border:1.5px solid var(--dt-info);border-radius:var(--dt-r-fillet);padding:11px 15px;margin-top:14px;font-size:13px;line-height:1.5;text-wrap:pretty\">\n    The same drafting tools James uses, laid out for a tablet and for the boys — bigger targets, plainer words, nothing hidden. A scene they propose is a real layout branch — <span style=\"font-family:'Azeret Mono',monospace;font-size:11px\">origin: family · status: proposed<\u002Fspan> — that claims real studs on the table, with its consequences worked out before it reaches @jfo as a request. Designs still under rights review never appear here.\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px 14px;align-items:start;margin-top:10px;font-size:12px;color:var(--dt-muted);line-height:1.4\"><span style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:0.1em;padding-top:2px\">SCHEMA<\u002Fspan><span style=\"text-wrap:pretty\"><strong style=\"color:var(--dt-ink)\">Sticker<\u002Fstrong> — the idea: kind, glyph, story.<\u002Fspan><span style=\"text-wrap:pretty\"><strong style=\"color:var(--dt-ink)\">Envelope<\u002Fstrong> — the room it claims: footprint × clear height, checked against tree, rail and neighbours.<\u002Fspan><span style=\"text-wrap:pretty\"><strong style=\"color:var(--dt-ink)\">Model<\u002Fstrong> — what fills it: Studio file, photos or a wand proposal. Must fit the envelope.<\u002Fspan><\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,0.75fr);gap:18px;margin-top:16px;align-items:start\">\n    <div style=\"background:var(--dt-sheet);border:1px solid var(--dt-ink);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:22px 24px 24px;display:grid;gap:18px;min-width:0\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n        <div style=\"font-family:'Spectral',serif;font-size:24px;font-weight:600\">Make a scene for the village<\u002Fdiv>\n        <span style=\"font-family:'Azeret Mono',monospace;font-size:10px;color:var(--dt-muted)\">{{ stepLine }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.5;color:var(--dt-muted)\">{{ hint }}<\u002Fdiv>\n\n      <div style=\"display:grid;gap:12px;border-top:1px dashed var(--dt-grid-mid);padding-top:18px\">\n        <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline\"><span style=\"font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:0.12em;color:{{ step1Color }}\">1<\u002Fspan><span style=\"font-family:'Spectral',serif;font-size:17px;font-weight:600\">Pick a sticker<\u002Fspan><span style=\"grid-column:2;font-size:12px;color:var(--dt-muted);text-wrap:pretty\">Each one claims a patch of studs — resize it after you drop it.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat({{ stickerCols }},minmax(0,1fr));gap:5px\">\n          <sc-for list=\"{{ stickers }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ s.pick }}\" aria-pressed=\"{{ s.active }}\" title=\"{{ s.name }}\" style=\"display:grid;justify-items:center;gap:3px;min-width:0;min-height:78px;padding:8px 3px;font-family:'Libre Franklin';font-siz    <\u002Fsc-if>\n            <sc-if value=\"{{ handleOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <g style=\"pointer-events:none\"><circle cx=\"{{ handleX }}\" cy=\"{{ handleY }}\" r=\"{{ handleR }}\" fill=\"var(--dt-accent)\" stroke=\"var(--dt-sheet)\" stroke-width=\"{{ handleSw }}\"><\u002Fcircle><foreignObject x=\"{{ handleLx }}\" y=\"{{ handleLy }}\" width=\"{{ handleLw }}\" height=\"{{ handleLh }}\"><div style=\"font-family:'Azeret Mono',monospace;font-size:{{ handleFs }};font-weight:600;color:var(--dt-accent-deep);white-space:nowrap;line-height:1;text-align:right\">{{ handleLabel }}<\u002Fdiv><\u002FforeignObject><\u002Fg>\n            <\u002Fsc-if>\n            <rect x=\"0\" y=\"0\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"var(--dt-ink)\" stroke-width=\"0.5\" style=\"pointer-events:none\"><\u002Frect>\n          <\u002Fsvg>\n          <div style=\"position:absolute;right:22px;bottom:22px;display:grid;gap:4px\"><button sc-camel-on-click=\"{{ placeCentre }}\" title=\"Drop the picked sticker in the middle of what you can see\" style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;font-weight:600;background:var(--dt-sheet);color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);padding:6px 9px;cursor:pointer;box-shadow:var(--dt-btn-shadow)\">＋ DROP IN THE MIDDLE<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dt-muted)\"><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:16px;height:6px;background:var(--dt-pass-bg);border-top:1.5px solid var(--dt-pass);border-bottom:1.5px solid var(--dt-pass)\"><\u002Fspan>where the train runs — fixed this year; anything overlapping it gets a fit check<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:12px;height:12px;background:var(--dt-pass-bg);border:1.5px solid var(--dt-pass)\"><\u002Fspan>the tree base — already built, it stays<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--dt-prov-bg);border:1.5px dashed var(--dt-prov)\"><\u002Fspan>under the branches — floor is free, headroom {{ canopyBottom }} bricks<\u002Fspan><span style=\"display:flex;gap:6px;align-items:center\"><span style=\"width:12px;height:12px;background:var(--dt-sheet);border:1.5px dashed var(--dt-prov)\"><\u002Fspan>your sticker and the studs it claims<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;gap:12px;border-top:1px dashed var(--dt-grid-mid);padding-top:18px\">\n        <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline\"><span style=\"font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:0.12em;color:{{ step3Color }}\">3<\u002Fspan><span style=\"font-family:'Spectral',serif;font-size:17px;font-weight:600\">Tell its story<\u002Fspan><span style=\"grid-column:2;font-size:12px;color:var(--dt-muted);text-wrap:pretty\">Type, or tap the mic and say it.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:8px\">\n          <input type=\"text\" value=\"{{ sceneName }}\" sc-camel-on-change=\"{{ setName }}\" aria-label=\"What is this place called?\" placeholder=\"What is it called? — e.g. Nils’s chocolate shop\" style=\"width:100%;font-family:'Libre Franklin';font-size:15px;font-weight:600;background:var(--dt-bg);color:var(--dt-ink);border:1.5px solid var(--dt-ink);padding:0 14px;border-radius:var(--dt-r-btn);height:48px;box-sizing:border-box\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:stretch\">\n            <input type=\"text\" value=\"{{ lore }}\" sc-camel-on-change=\"{{ setLore }}\" aria-label=\"What happens there?\" placeholder=\"What happens there? — e.g. the train stops so Nils can load hot chocolate\" style=\"width:100%;min-width:0;font-family:'Libre Franklin';font-size:15px;background:var(--dt-bg);color:var(--dt-ink);border:1.5px solid var(--dt-ink);padding:0 14px;border-radius:var(--dt-r-btn);height:48px;box-sizing:border-box\">\n            <button sc-camel-on-click=\"{{ voiceLore }}\" aria-pressed=\"{{ listeningLore }}\" aria-label=\"Say it instead\" style=\"height:48px;font-size:20px;background:{{ micBgLore }};color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">🎙<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;gap:12px;border-top:1px dashed var(--dt-grid-mid);padding-top:18px\">\n        <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline\"><span style=\"font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:0.12em;color:{{ step4Color }}\">4<\u002Fspan><span style=\"font-family:'Spectral',serif;font-size:17px;font-weight:600\">Model it<\u002Fspan><span style=\"grid-column:2;font-size:12px;color:var(--dt-muted);text-wrap:pretty\">Show what it looks like — build it in Studio, build it for real and photograph it, or let the wand sketch a start.<\u002Fspan><\u002Fdiv>\n        <div ref=\"{{ modelRef }}\" style=\"display:grid;grid-template-columns:{{ modelCols }};gap:14px;padding:6px 2px 6px\">\n          <div style=\"position:relative;background:color-mix(in oklch, var(--dt-layer-landscape) 9%, var(--dt-sheet));border:1px solid var(--dt-layer-landscape);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0;overflow:hidden\">\n            \n            <span style=\"font-family:'Azeret Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.08em;color:{{ studioColor }};border:1.5px {{ studioBorder }} {{ studioColor }};padding:2px 7px;border-radius:var(--dt-r-pill);white-space:nowrap;justify-self:start\">{{ studioTag }}<\u002Fspan>\n            <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:700;font-style:italic;line-height:1.15;text-wrap:balance\">Build it in Studio<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--dt-muted);line-height:1.5;text-wrap:pretty\">BrickLink Studio is the free program the whole village is designed in. Build your idea brick by brick, save the file, and attach it here.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:2px\"><a href=\"https://www.bricklink.com/v3/studio/download.page\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Libre Franklin';font-size:13px;font-weight:600;text-decoration:none;background:var(--dt-ink);color:var(--dt-on-ink);padding:9px 13px;border:0;border-radius:var(--dt-r-btn);box-shadow:var(--dt-btn-shadow);justify-self:start;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left;white-space:nowrap\">Open Studio <span aria-hidden=\"true\">↗<\u002Fspan><\u002Fa><label style=\"font-family:'Libre Franklin';font-size:12.5px;font-weight:600;background:transparent;color:var(--dt-ink);padding:8px 12px;border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer;justify-self:start;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden;text-align:left;white-space:nowrap\">Attach the .io file<input type=\"file\" accept=\".io\" sc-camel-on-change=\"{{ pickStudio }}\" aria-label=\"Attach the .io file\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\"><\u002Flabel><\u002Fdiv>\n            <sc-if value=\"{{ hasStudio }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'Azeret Mono',monospace;font-size:11px\">▤ {{ studioName }}<\u002Fspan><button sc-camel-on-click=\"{{ clearStudio }}\" style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;background:transparent;color:var(--dt-muted);border:1px dashed var(--dt-muted);border-radius:var(--dt-r-btn);padding:3px 7px;cursor:pointer\">REMOVE<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"position:relative;background:color-mix(in oklch, var(--dt-info) 9%, var(--dt-sheet));border:1px solid var(--dt-info);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0;overflow:hidden\">\n            \n            <span style=\"font-family:'Azeret Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.08em;color:{{ photoColor }};border:1.5px {{ photoBorder }} {{ photoColor }};padding:2px 7px;border-radius:var(--dt-r-pill);white-space:nowrap;justify-self:start\">{{ photoTag }}<\u002Fspan>\n            <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:700;font-style:italic;line-height:1.15;text-wrap:balance\">Build it for real, then photograph it<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--dt-muted);line-height:1.5;text-wrap:pretty\">Use bricks from the loose bin. Take a photo from the front and one from above so the size shows against the studs.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:2px\"><label style=\"font-family:'Libre Franklin';font-size:13px;font-weight:600;text-decoration:none;background:var(--dt-ink);color:var(--dt-on-ink);padding:9px 13px;border:0;border-radius:var(--dt-r-btn);box-shadow:var(--dt-btn-shadow);justify-self:start;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left;white-space:nowrap\">Add photos<input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ pickPhotos }}\" aria-label=\"Add photos\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\"><\u002Flabel><\u002Fdiv>\n            <sc-if value=\"{{ hasPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ photos }}\" as=\"p\" hint-placeholder-count=\"0\"><div role=\"img\" aria-label=\"{{ p.name }}\" style=\"width:64px;height:64px;background-image:url({{ p.src }});background-size:cover;background-position:center;border:1px solid var(--dt-ink);border-radius:var(--dt-r-fillet)\"><\u002Fdiv><\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ clearPhotos }}\" style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;background:transparent;color:var(--dt-muted);border:1px dashed var(--dt-muted);border-radius:var(--dt-r-btn);padding:3px 7px;cursor:pointer;align-self:end\">REMOVE ALL<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"position:relative;background:color-mix(in oklch, var(--dt-accent) 9%, var(--dt-sheet));border:1px solid var(--dt-accent);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:16px 18px 18px;display:grid;grid-template-columns:{{ wandInner }};gap:10px;align-content:start;min-width:0;overflow:hidden;grid-column:{{ wandSpan }}\">\n            \n            <div style=\"display:grid;gap:10px;align-content:start;min-width:0\">\n            <span style=\"font-family:'Azeret Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.08em;color:{{ wandColor }};border:1.5px {{ wandBorder }} {{ wandColor }};padding:2px 7px;border-radius:var(--dt-r-pill);white-space:nowrap;justify-self:start\">{{ wandTag }}<\u002Fspan>\n            <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:700;font-style:italic;line-height:1.15;text-wrap:balance\">Try the magic wand<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--dt-muted);line-height:1.5;text-wrap:pretty\">The AI reads your story, the room you claimed and what kind of thing it is, looks at what other builders have made like it, and sketches a first version. It is a starting point, not an answer: keep it, change it, ask for another, or throw it out and build your own.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:8px;align-content:{{ wandActionsAlign }};min-width:0\">\n            <button sc-camel-on-click=\"{{ runWand }}\" disabled=\"{{ wandDisabled }}\" style=\"font-family:'Libre Franklin';font-size:13px;font-weight:600;text-decoration:none;background:var(--dt-accent);color:#FFFDF8;padding:9px 13px;border:0;border-radius:var(--dt-r-btn);box-shadow:var(--dt-btn-shadow);justify-self:start;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left;white-space:nowrap\">{{ wandLabel }}<\u002Fbutton>\n            <div style=\"font-size:11.5px;color:var(--dt-muted)\">{{ wandWhy }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ wandBusy }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'Azeret Mono',monospace;font-size:10px;color:var(--dt-accent-deep);animation:dtWand 1.2s ease-in-out infinite\">{{ wandStatus }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"grid-column:1 / -1;min-width:0\">\n            <sc-if value=\"{{ hasWand }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;gap:8px;border-top:1px dashed var(--dt-grid-mid);padding-top:8px\">\n                <div style=\"font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:0.1em;color:var(--dt-muted)\">IT LOOKED AT<\u002Fdiv>\n                <div style=\"display:grid;gap:4px\">\n                  <sc-for list=\"{{ wandPrecedents }}\" as=\"w\" hint-placeholder-count=\"3\"><div style=\"display:flex;gap:8px;align-items:center;font-size:11.5px\"><span style=\"width:28px;height:28px;flex:none;border:1px dashed var(--dt-grid-mid);border-radius:var(--dt-r-fillet);display:grid;place-items:center;font-size:14px\">{{ w.glyph }}<\u002Fspan><span style=\"min-width:0\"><span style=\"font-weight:600\">{{ w.title }}<\u002Fspan> <span style=\"color:var(--dt-muted)\">{{ w.meta }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:0.1em;color:var(--dt-muted)\">IT SUGGESTS<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.5;text-wrap:pretty\">{{ wandProposal }}<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ keepWand }}\" aria-pressed=\"{{ wandKept }}\" style=\"font-family:'Libre Franklin';font-size:12px;font-weight:600;background:{{ wandKeepBg }};color:{{ wandKeepFg }};border:1.5px solid var(--dt-ink);padding:6px 11px;border-radius:var(--dt-r-btn);cursor:pointer\">{{ wandKeepLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ runWand }}\" style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;background:transparent;color:var(--dt-ink);border:1px dashed var(--dt-ink);padding:6px 9px;border-radius:var(--dt-r-btn);cursor:pointer\">TRY AGAIN<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasLog }}\" hint-placeholder-val=\"{{ false }}\">\n        <details style=\"border-top:1px dashed var(--dt-grid-mid);padding-top:10px\">\n          <summary style=\"cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none\"><span style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--dt-muted)\">WHAT HAPPENED · {{ logCount }}<\u002Fspan><span style=\"font-size:12px;color:var(--dt-muted)\">{{ logLast }}<\u002Fspan><span style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;color:var(--dt-accent-deep);margin-left:auto\">OPEN ▾<\u002Fspan><\u002Fsummary>\n          <div style=\"display:grid;gap:2px;margin-top:8px;max-height:180px;overflow:auto;font-size:12px\">\n            <sc-for list=\"{{ logRows }}\" as=\"e\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:52px 64px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--dt-grid-mid)\"><span style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;color:var(--dt-muted)\">{{ e.time }}<\u002Fspan><span style=\"font-family:'Azeret Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.06em;color:{{ e.color }}\">{{ e.kind }}<\u002Fspan><span style=\"text-wrap:pretty\">{{ e.text }}<\u002Fspan><sc-if value=\"{{ e.canUndo }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ undo }}\" style=\"font-family:'Azeret Mono',monospace;font-size:9px;font-weight:600;background:transparent;color:var(--dt-ink);border:1px solid var(--dt-ink);border-radius:var(--dt-r-btn);padding:2px 6px;cursor:pointer\">↶ UNDO<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--dt-muted);margin-top:6px;text-wrap:pretty\">Every placement, move, resize, turn and removal is kept — this is what versions, undo and \"how do the boys actually use this\" are built from. Nothing here is sent to James until you press Send.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"background:var(--dt-sheet);border:1px solid var(--dt-ink);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:18px 20px;display:grid;gap:12px\">\n        <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:600\">What your scene would need<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--dt-muted);line-height:1.5\">Worked out from your stickers and their envelopes, the same way the main drafting sheets do. Tap one to pick it out on the map.<\u002Fdiv>\n        <sc-if value=\"{{ hasStickers }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:8px\">\ :var(--dt-bg);color:var(--dt-ink);border:1.5px solid var(--dt-ink);padding:0 12px;border-radius:var(--dt-r-btn);height:42px;box-sizing:border-box\">\n              <button sc-camel-on-click=\"{{ voiceItem }}\" aria-pressed=\"{{ listeningItem }}\" aria-label=\"Say it instead\" style=\"height:42px;font-size:18px;background:{{ micBgItem }};color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">🎙<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:6px;border-top:1px dashed var(--dt-grid-mid);padding-top:10px\">\n            <span style=\"font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--dt-muted)\">FOOTPRINT<\u002Fspan>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <sc-for list=\"{{ sel.sizes }}\" as=\"z\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ z.pick }}\" aria-pressed=\"{{ z.on }}\" style=\"min-height:36px;padding:6px 12px;font-family:'Azeret Mono',monospace;font-size:11px;font-weight:600;color:{{ z.fg }};background:{{ z.bg }};border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-pill);cursor:pointer\">{{ z.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ toggleSizer }}\" aria-pressed=\"{{ sizerOpen }}\" aria-expanded=\"{{ sizerOpen }}\" style=\"min-height:36px;padding:6px 12px;font-family:'Azeret Mono',monospace;font-size:11px;font-weight:600;color:{{ sizerFg }};background:{{ sizerBg }};border:1.5px dashed var(--dt-ink);border-radius:var(--dt-r-pill);cursor:pointer\">{{ sizerLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ sel.rotate }}\" style=\"min-height:36px;padding:6px 12px;font-family:'Libre Franklin';font-size:12.5px;font-weight:600;color:var(--dt-ink);background:transparent;border:1.5px dashed var(--dt-ink);border-radius:var(--dt-r-pill);cursor:pointer\">↻ Turn it<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ sizerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1.5px solid var(--dt-accent);background:var(--dt-bg);border-radius:var(--dt-r-fillet);padding:12px 14px;display:grid;gap:10px\">\n                <div style=\"font-size:12px;color:var(--dt-muted);text-wrap:pretty\">Any size from 1 × 1 up to 32 × 32 studs — one MILS module is the biggest a sticker can be for now. You can also drag the corner handle on the map.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end\">\n                  <label style=\"display:grid;gap:4px;font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--dt-muted)\">ACROSS\n                    <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px\"><button sc-camel-on-click=\"{{ wDown }}\" aria-label=\"Narrower\" style=\"height:40px;font-size:18px;font-weight:600;background:transparent;color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">−<\u002Fbutton><input type=\"number\" min=\"1\" max=\"32\" value=\"{{ sizerW }}\" sc-camel-on-change=\"{{ setW }}\" aria-label=\"Studs across\" style=\"height:40px;text-align:center;font-family:'Azeret Mono',monospace;font-size:16px;font-weight:600;background:var(--dt-sheet);color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);min-width:0;box-sizing:border-box\"><button sc-camel-on-click=\"{{ wUp }}\" aria-label=\"Wider\" style=\"height:40px;font-size:18px;font-weight:600;background:transparent;color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">+<\u002Fbutton><\u002Fdiv>\n                  <\u002Flabel>\n                  <span style=\"font-family:'Azeret Mono',monospace;font-size:16px;color:var(--dt-muted);padding-bottom:10px\">×<\u002Fspan>\n                  <label style=\"display:grid;gap:4px;font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--dt-muted)\">DEEP\n                    <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px\"><button sc-camel-on-click=\"{{ hDown }}\" aria-label=\"Shallower\" style=\"height:40px;font-size:18px;font-weight:600;background:transparent;color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">−<\u002Fbutton><input type=\"number\" min=\"1\" max=\"32\" value=\"{{ sizerH }}\" sc-camel-on-change=\"{{ setH }}\" aria-label=\"Studs deep\" style=\"height:40px;text-align:center;font-family:'Azeret Mono',monospace;font-size:16px;font-weight:600;background:var(--dt-sheet);color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);min-width:0;box-sizing:border-box\"><button sc-camel-on-click=\"{{ hUp }}\" aria-label=\"Deeper\" style=\"height:40px;font-size:18px;font-weight:600;background:transparent;color:var(--dt-ink);border:1.5px solid var(--dt-ink);border-radius:var(--dt-r-btn);cursor:pointer\">+<\u002Fbutton><\u002Fdiv>\n                  <\u002Flabel>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'Azeret Mono',monospace;font-size:11px;color:var(--dt-prov-deep)\">= {{ sizerArea }} STUDS<\u002Fspan><span style=\"font-size:12px;color:{{ sizerNoteColor }};flex:1;min-width:140px;text-wrap:pretty\">{{ sizerNote }}<\u002Fspan><button sc-camel-on-click=\"{{ applySizer }}\" disabled=\"{{ sizerBlocked }}\" style=\"height:36px;padding:0 14px;font-family:'Libre Franklin';font-size:12.5px;font-weight:600;background:var(--dt-ink);color:var(--dt-on-ink);border:0;border-radius:var(--dt-r-btn);cursor:pointer;box-shadow:var(--dt-btn-shadow)\">Use this size<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dt-muted);text-wrap:pretty\">{{ sel.sizeNote }} On the map: drag the sticker to move it, drag the orange corner to resize it.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ sel.remove }}\" style=\"justify-self:start;min-height:36px;padding:6px 12px;font-family:'Libre Franklin';font-size:12.5px;font-weight:600;color:var(--dt-block-deep);background:transparent;border:1.5px dashed var(--dt-block);border-radius:var(--dt-r-pill);cursor:pointer\">Take it off the map<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noSel }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:600;color:var(--dt-muted)\">Nothing picked<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--dt-muted);line-height:1.5;text-wrap:pretty\">Tap a sticker on the map, or in the list above, to resize it, turn it, move it or take it off. Tap empty snow to put it down.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--dt-sheet);border:1px solid var(--dt-ink);box-shadow:var(--dt-shadow);border-radius:var(--dt-r-card);padding:18px 20px;display:grid;gap:12px\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ send }}\" disabled=\"{{ cantSend }}\" style=\"font-family:'Libre Franklin';font-size:16px;font-weight:600;background:var(--dt-ink);color:var(--dt-on-ink);border:none;padding:14px 18px;cursor:pointer;border-radius:var(--dt-r-btn);box-shadow:var(--dt-btn-shadow);min-height:52px\">Send it to James →<\u002Fbutton>\n          <div style=\"font-size:12px;color:var(--dt-muted);line-height:1.5\">{{ sendHint }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><span style=\"display:inline-block;font-family:'Azeret Mono',monospace;font-size:12px;font-weight:600;color:var(--dt-prov-deep);border:2.5px solid var(--dt-prov);padding:5px 12px;border-radius:var(--dt-r-fillet);animation:dtStampIn .35s ease-out both\">◇ SENT · PROPOSED<\u002Fspan><span style=\"font-size:13px\">It arrives with everything it needs worked out. The answer can be yes, not yet, or a question back.<\u002Fspan><\u002Fdiv>\n          <div style=\"border:1px dashed var(--dt-grid-mid);border-radius:var(--dt-r-fillet);padding:12px 14px;display:grid;gap:6px;font-size:12px\">\n            <div style=\"font-family:'Azeret Mono',monospace;font-size:9px;letter-spacing:0.1em;color:var(--dt-muted)\">WHAT JAMES'S SHEET RECEIVES — THE SAME REQUEST CARD AS C-01<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:'Azeret Mono',monospace;font-size:10.5px\">\n              <span style=\"color:var(--dt-muted)\">FROM<\u002Fspan><span>@boys · Family Workbench<\u002Fspan>\n              <span style=\"color:var(--dt-muted)\">ASKS<\u002Fspan><span style=\"font-family:'Libre Franklin';font-size:12.5px\">{{ reqAsks }}<\u002Fspan>\n              <span style=\"color:var(--dt-muted)\">CLAIMS<\u002Fspan><span>{{ studs }} studs in {{ itemCount }} {{ itemWord }} · tallest {{ tallest }} bricks · ~{{ bricks }} bricks · track {{ trackShort }} · headroom {{ heightShort }}<\u002Fspan>\n              <span style=\"color:var(--dt-muted)\">ATTACHED WORK<\u002Fspan><span>{{ attachedWork }}<\u002Fspan>\n              <span style=\"color:var(--dt-muted)\">ORIGIN · STATUS<\u002Fspan><span>family · proposed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"font-family:'Azeret Mono',monospace;font-size:10px;font-weight:600;background:transparent;color:var(--dt-muted);border:1px dashed var(--dt-unres);padding:6px 10px;cursor:pointer;border-radius:var(--dt-r-btn);justify-self:start\">MAKE ANOTHER<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--dt-sheet);border:1px dashed var(--dt-unres);border-radius:var(--dt-r-card);padding:14px 18px;font-size:11.5px;color:var(--dt-muted);line-height:1.5\">\n        <div style=\"font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:0.1em;margin-bottom:6px\">HOW THIS SHARES TOOLS WITH JAMES’S SHEETS<\u002Fdiv>\n        Three things, kept apart: a <strong>sticker<\u002Fstrong> says what the idea is; its <strong>envelope<\u002Fstrong> is the room it claims — a footprint in studs plus the height that is actually clear there (under the branches, less); a <strong>model<\u002Fstrong> (step 4) is something that must fit inside that envelope. Same tokens, same request card, same basis (story), same evidence chips — at lower density, bigger targets, plain words. A sticker is a layout-branch proposal that claims an envelope; \"Send to James\" is exactly the @boys request that C-01 answers, with attached work listed so \"words only\" is visible. The tree’s base, height and branch overhang are <span style=\"font-family:'Azeret Mono',monospace;font-size:10px;color:var(--dt-prov-deep)\">◇ TO BE MEASURED<\u002Fspan> (J9) — adjust them in Tweaks; every headroom check follows. The magic wand is a mock — the real one needs a retrieval backend (story + claimed area + kind → precedent study → proposal) and an audit. Private designs are filtered out before this page ever renders them. Every sticker carries its own story (who or what it is, what it does here) beside the scene’s story — both travel on the request (schema: Sticker {label, story} → story-graph node, J11). Envelopes are capped at 32 × 32 studs — one MILS module — for now. Naming open: “Rail” on the SHOW row is a placeholder for a namespace still to settle — rail · railbed · right-of-way (the studs the train needs clear beside it) · rail infrastructure (stops, signals). No step here can buy, freeze, or change James’s layout.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;paper&quot;,&quot;blueprint&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'paper'|'blueprint'&quot;}}\">\nclass Component extends DCLogic {\n  state = { dark: null, tool: 'shop', customText: '', customs: [], items: [], selId: null, sceneName: '', lore: '', sent: false, listening: null, narration: '', narAt: 0, log: [], show: { track: true, tree: true, stickers: true, grid: true }, zoom: 1, cx: 56, cy: 56, view: 'plan', sizer: null, armed: false, hover: null, narrow: false, model: { studio: null, photos: [], wand: null, wandBusy: false, wandStatus: '', wandKept: false }, drag: null };\n  svgRef = React.createRef(); modelRef = React.createRef();\n  LAYERS = [\n    { k: 'track', mark: '🟩', name: 'Rail', off: 'Hide the rail (it stays put — only the drawing goes).' },\n    { k: 'tree', mark: '🎄', name: 'Tree', off: 'Hide the tree — its studs stay taken; a dotted outline remains.' },\n    { k: 'stickers', mark: '★', name: 'Stickers', off: 'Hide your stickers — nothing is removed.' },\n    { k: 'grid', mark: '▦', name: 'Studs', off: 'Hide the stud grid.' }\n  ];\n  ZOOMS = [{ z: 1, name: 'Table', hint: 'The whole table' }, { z: 2, name: 'Closer', hint: 'Half the table — drag to move around' }, { z: 4, name: 'Studs', hint: 'Every stud — drag to move around' }];\n  STICKERS = [\n    { k: 'fig', glyph: '🧍', name: 'Minifig', sizes: [[2, 2]], hts: [4], bps: 1, title: 'A minifigure', detail: 'One figure standing on a 2 × 2 patch. Ornament layer — no fit check needed.', tag: '■ EASY', color: 'var(--dt-pass)', border: 'solid' },\n    { k: 'horse', glyph: '🐴', name: 'Horse', sizes: [[2, 4]], hts: [3], bps: 1, title: 'A horse', detail: 'Stands on 2 × 4. Turn it to face along the path. Ornament layer.', tag: '■ EASY', color: 'var(--dt-pass)', border: 'solid' },\n    { k: 'lamp', glyph: '🕯️', name: 'Lamp post', sizes: [[1, 1], [2, 2]], hts: [5, 6], bps: 3, title: 'A lamp post', detail: 'One stud, or 2 × 2 with a base. If it should light up, that needs the electrical layer — it goes on the list as a question.', tag: '◇ ASK', color: 'var(--dt-accent-deep)', border: 'dashed' },\n    { k: 'snowman', glyph: '⛄', name: 'Snowman', sizes: [[2, 2], [4, 4]], hts: [4, 7], bps: 2.25, title: 'A snowman', detail: 'Small on 2 × 2, big on 4 × 4. Ornament layer.', tag: '■ EASY', color: 'var(--dt-pass)', border: 'solid' },\n    { k: 'tree', glyph: '🌲', name: 'Tree', sizes: [[2, 2], [4, 4], [6, 6]], hts: [5, 9, 14], bps: 1.4, title: 'A tree', detail: 'Three sizes. Goes on the planting layer; fits anywhere off the track.', tag: '■ EASY', color: 'var(--dt-pass)', border: 'solid' },\n    { k: 'shop', glyph: '🏠', name: 'Building', sizes: [[8, 8], [8, 16], [16, 16]], hts: [10, 12, 16], bps: 2.2, title: 'A building', detail: 'Needs flat ground the whole way under it. If the train should stop here, that is a siding — a bigger ask.', tag: '◇ BIG', color: 'var(--dt-prov-deep)', border: 'dashed' },\n    { k: 'stop', glyph: '🚉', name: 'Train stop', sizes: [[4, 16], [6, 16]], hts: [4, 9], bps: 1, title: 'A train stop', detail: 'A platform that must touch the rail. Track pieces are fixed this year, so this goes on the list as a question.', tag: '▲ TRACK', color: 'var(--dt-block-deep)', border: 'solid' }\n  ];\n  GLYPHS = [['reindeer|deer|moose', '🦌'], ['sled|sleigh', '🛷'], ['dog|puppy', '🐕'], ['cat|kitten', '🐈'], ['horse|pony', '🐴'], ['bear', '🐻'], ['penguin', '🐧'], ['owl', '🦉'], ['rabbit|bunny', '🐇'], ['fox', '🦊'], ['gift|present', '🎁'], ['bell', '🔔'], ['star', '⭐'], ['santa|claus', '🎅'], ['elf', '🧝'], ['car|truck|van', '🚗'], ['bridge', '🌉'], ['well', '🪣'], ['fountain', '⛲'], ['bench|chair', '🪑'], ['fence|gate', '🚧'], ['igloo|mountain|hill', '🏔️'], ['rock|boulder', '🪨'], ['pond|ice|rink|lake', '🧊'], ['fire|campfire', '🔥'], ['cocoa|chocolate|coffee|cafe', '☕'], ['cookie|bakery|bread', '🍪'], ['church|chapel', '⛪'], ['castle|tower', '🏰'], ['tent', '⛺'], ['boat|ship', '⛵'], ['robot', '🤖'], ['dragon', '🐉'], ['snow', '❄️'], ['ski', '🎿'], ['candy|sweet', '🍬'], ['market|stall|shop|store', '🏪'], ['barn|farm', '🏚️'], ['house|home|cabin|cottage|hut', '🏡'], ['sign|post', '🪧'], ['wagon|cart', '🛒']];\n  PRECEDENTS = [\n    { glyph: '🏪', title: 'Winter market stall', meta: '8 × 8 · Rebrickable MOC · 2019 · 96 parts' },\n    { glyph: '🏡', title: 'Snowy cottage', meta: '16 × 16 · LEGO 10229 sub-build · 2012' },\n    { glyph: '🛷', title: 'Sled run with lamp', meta: '4 × 12 · BrickLink Studio gallery · 2022' },\n    { glyph: '⛲', title: 'Frozen fountain', meta: '6 × 6 · Eurobricks winter village · 2020' },\n    { glyph: '🚉', title: 'Halt platform', meta: '4 × 16 · MILS-compatible · 2021' },\n    { glyph: '🌲', title: 'Pine cluster', meta: '4 × 4 · official parts pack · 2018' }\n  ];\n  isDark() {\n    if (this.state.dark !== null) return this.state.dark;\n    if (this.props.theme === 'blueprint') return true;\n    if (this.props.theme === 'paper') return false;\n    return typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;\n  }\n  applyBody() { document.body.classList.toggle('dt-blueprint', this.isDark()); }\n  componentDidMount() { this.applyBody(); this.forceUpdate(); if (typeof ResizeObserver !== 'undefined') { this._ro = new ResizeObserver(en => { const w = en[0].contentRect.width; const narrow = w < 720; if (narrow !== this.state.narrow) this.setState({ narrow }); }); const el = this.modelRef.current; if (el) this._ro.observe(el); } }\n  componentWillUnmount() { if (this._ro) this._ro.disconnect(); clearTimeout(this._toast); }\n  componentDidUpdate() { this.applyBody(); }\n  pulse(key, val) {\n    this.prev = this.prev || {}; this.pulseAt = this.pulseAt || {}; this.pulseTog = this.pulseTog || {};\n    const v = JSON.stringify(val), now = Date.now();\n    if (key in this.prev && this.prev[key] !== v) { this.pulseAt[key] = now; this.pulseTog[key] = !this.pulseTog[key]; }\n    this.prev[key] = v;\n    return (now - (this.pulseAt[key] || 0) < 900) ? 'dtChange' + (this.pulseTog[key] ? 'A' : 'B') + ' .8s ease-out' : 'none';\n  }\n  tree() { const base = 16; return { base, half: 8, x0: 48, height: 40, baseH: 8, canopyR: 28, canopyBottom: 10 }; } // 41843 measured 2026-09-17 (DEC-016) — not tweakable\n  headroomAt(x, y, w, h) { const T = this.tree(); const nx = Math.max(x, Math.min(56, x + w)), ny = Math.max(y, Math.min(56, y + h)); const dMin = Math.hypot(nx - 56, ny - 56); return dMin < T.canopyR ? T.canopyBottom : 99; }\n  act(kind, text, patch, before) {\n    this.setState(st => Object.assign({}, typeof patch === 'function' ? patch(st) : (patch || {}), { narration: text, narAt: Date.now(), log: st.log.concat([{ t: Date.now(), kind, text, before: before === undefined ? null : before }]).slice(-300) }));\n    this.tick();\n  }\n  toast(text) { this.setState({ narration: text, narAt: Date.now() }); this.tick(); }\n  tick() { clearTimeout(this._toast); this._toast = setTimeout(() => this.forceUpdate(), 4300); }\n  undo() {\n    const log = this.state.log; let i = log.length - 1; while (i >= 0 && !log[i].before) i--; if (i < 0) return;\n    const e = log[i]; this.setState(st => ({ items: e.before, selId: null, sent: false, narration: 'Undid: ' + e.text, narAt: Date.now(), log: st.log.slice(0, i).concat(st.log.slice(i + 1), [{ t: Date.now(), kind: 'undo', text: 'Undid: ' + e.text, before: null }]) })); this.tick();\n  }\n  allStickers() { return this.STICKERS.concat(this.state.customs); }\n  byKey(k) { return this.allStickers().find(x => x.k === k); }\n  view() { const z = this.state.zoom, half = 56 / z; return [this.state.cx - half, this.state.cy - half, 112 / z, 112 / z]; }\n  clampView(cx, cy, z) { const half = 56 / z; return [Math.min(112 - half, Math.max(half, cx)), Math.min(112 - half, Math.max(half, cy))]; }\n  toStud(e) { const el = this.svgRef.current; if (!el) return null; const r = el.getBoundingClientRect(); const [vx, vy, vw, vh] = this.view(); return [vx + (e.clientX - r.left) / r.width * vw, vy + (e.clientY - r.top) / r.height * vh]; }\n  ringHit(x, y, w, h) { const CX = 56, CY = 56; const dx = Math.max(x - CX, 0, CX - (x + w)), dy = Math.max(y - CY, 0, CY - (y + h)); const fx = Math.max(Math.abs(x - CX), Math.abs(x + w - CX)), fy = Math.max(Math.abs(y - CY), Math.abs(y + h - CY)); const dMin = Math.hypot(dx, dy), dMax = Math.hypot(fx, fy); return dMin <= 44 && dMax >= 36 ? 'track' : dMax < 36 ? 'inside' : 'snow'; }\n  overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }\n  blocked(rect, ignoreId) { const T = this.tree(); if (this.overlaps(rect, { x: T.x0, y: T.x0, w: T.base, h: T.base })) return 'That is the tree’s base — it is already built.'; const hit = this.state.items.find(it => it.id !== ignoreId && this.overlaps(rect, it)); if (hit) return 'That overlaps your ' + hit.name.toLowerCase() + ' — pick a free patch or make one smaller.'; return null; }\n  placeAt(sx, sy) {\n    const s = this.state; if (!s.show.stickers) { this.toast('Show \"Stickers\" first to change them.'); return; }\n    if (s.tool === 'custom') { this.toast('Describe your sticker and tap \"Make the sticker\" first.'); return; }\n    const def = this.byKey(s.tool); const [w, h] = def.sizes[0];\n    let x = Math.round(sx - w / 2), y = Math.round(sy - h / 2); x = Math.min(112 - w, Math.max(0, x)); y = Math.min(112 - h, Math.max(0, y));\n    const rect = { x, y, w, h }; const why = this.blocked(rect); if (why) { this.toast(why); return; }\n    const id = 'i' + Date.now().toString(36); const zone = this.ringHit(x, y, w, h);\n    const hb = (def.hts || [4])[0]; const room = this.headroomAt(x, y, w, h);\n    this.act('place', def.name + ' dropped at ' + x + ', ' + y + ' — ' + w + ' × ' + h + ' studs, ' + hb + ' bricks tall.' + (zone === 'track' ? ' Overlaps the rail — fit check.' : '') + (hb > room ? ' Too tall under the branches — only ' + room + ' clear.' : ''), st => ({ items: st.items.concat([Object.assign({ id, k: def.k, name: def.name, glyph: def.glyph, sizeIdx: 0, hb }, rect)]), selId: id, armed: false, hover: null, sent: false }), s.items);\n  }\n  glyphFor(t) { const s = t.toLowerCase(); for (const [re, g] of this.GLYPHS) if (new RegExp('\\\\b(' + re + ')').test(s)) return g; return '✦'; }\n  sizeFor(t) { const s = t.toLowerCase(); if (/huge|giant|enormous/.test(s)) return [[16, 16], [8, 8], [4, 4]]; if (/big|large|building|house|barn|castle|church/.test(s)) return [[8, 8], [4, 4], [16, 16]]; if (/tiny|small|little/.test(s)) return [[2, 2], [4, 4], [1, 1]]; return [[4, 4], [2, 2], [8, 8]]; }\n  renderVals() {\n    const s = this.state, dark = this.isDark();\n    const INK = 'var(--dt-ink)', ON = 'var(--dt-on-ink)';\n    const all = this.allStickers();\n    const armed = s.armed && s.tool !== 'custom';\n    const stickers = all.map(x => { const on = armed && s.tool === x.k; return { glyph: x.glyph, name: x.name, size: x.sizes[0][0] + '×' + x.sizes[0][1] + (x.sizes.length > 1 ? '+' : ''), active: on, fg: on ? ON : INK, bg: on ? INK : 'transparent', edge: 'var(--dt-ink)', shadow: 'none', lift: 'none', borderStyle: on ? 'solid' : 'dashed', pick: () => { if (on) { this.setState({ armed: false }); this.toast('Done adding. Tap a sticker on the map to pick it.'); } else { this.setState({ tool: x.k, armed: true, selId: null, sizer: null }); this.toast(x.name + ' ready — tap the snow where it should go.'); } } }; });\n    const [vx, vy, vw, vh] = this.view();\n    const sel = s.items.find(it => it.id === s.selId) || null;\n    const items = s.items.map(it => { const isSel = sel && sel.id === it.id; const zone = this.ringHit(it.x, it.y, it.w, it.h); const lfs = Math.max(1.6, Math.min(2.6, it.w * 0.28)); return { x: it.x, y: it.y, w: it.w, h: it.h, glyph: it.glyph, fs: (Math.min(it.w, it.h) * 0.62) + 'px', hasLabel: !!(it.label && it.label.trim()), label: it.label || '', lx: it.x + it.w / 2 - Math.max(it.w, 12) / 2, ly:
