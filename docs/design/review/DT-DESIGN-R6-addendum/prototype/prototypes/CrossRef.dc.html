<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,700&family=Libre+Franklin:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../dt/tokens.css">
<link rel="stylesheet" href="../dt/responsive.css">
<script src="../dt/overlay.js"></script>
<script src="../dt/landing.js"></script>
</helmet>
<a class="dt-crossref" ref="{{ anchorRef }}" href="{{ href }}" onMouseEnter="{{ show }}" onMouseLeave="{{ hideSoon }}" onFocus="{{ show }}" onBlur="{{ hideSoon }}" onKeyDown="{{ key }}" aria-describedby="{{ descId }}" style="font-family:'Azeret Mono',monospace;font-size:9.5px;font-weight:600;color:var(--dt-accent-deep);border:1px dashed var(--dt-grid-mid);border-radius:var(--dt-r-fillet);padding:1px 6px;text-decoration:none;white-space:nowrap;display:inline-block">{{ labelText }}</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;200px&quot;},&quot;sheet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A-01&quot;,&quot;B-01&quot;,&quot;C-01&quot;,&quot;P-01&quot;,&quot;M-01&quot;,&quot;F-01&quot;,&quot;Hub&quot;],&quot;default&quot;:&quot;A-01&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CrossRef&quot;},&quot;card&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CrossRef&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A-01 · Does it fit? →&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CrossRef&quot;},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;forward&quot;,&quot;back&quot;],&quot;default&quot;:&quot;forward&quot;,&quot;tsType&quot;:&quot;'forward'|'back'&quot;,&quot;section&quot;:&quot;CrossRef&quot;},&quot;href&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { phase: 'closed' };
  anchorRef = React.createRef(); panelRef = React.createRef(); _uid = 'xr' + Math.random().toString(36).slice(2, 7);
  ov() { if (!this._ov) this._ov = window.dtOverlay.attach(this, { anchor: () => this.anchorRef.current, render: () => this.card(this.renderVals()), width: 320 }); return this._ov; }
  componentDidUpdate() { if (this._ov) { this._ov.paint(); this._ov.place(); } }
  componentWillUnmount() { if (this._ov) this._ov.destroy(); this.setState = () => {}; }
  card(v) {
    const h = React.createElement, mono = "'Azeret Mono',monospace";
    return h('span', { ref: this.panelRef, role: 'tooltip', id: v.descId, onMouseEnter: v.show, onMouseLeave: v.hideSoon, style: { position: 'fixed', top: 0, left: 0, width: 320, boxSizing: 'border-box', display: 'grid', gap: 6, background: 'var(--dt-sheet)', color: 'var(--dt-ink)', border: '1.5px solid var(--dt-ink)', boxShadow: 'var(--dt-shadow)', borderRadius: 'var(--dt-r-card)', padding: '11px 13px', fontFamily: "'Libre Franklin',sans-serif", textAlign: 'left', fontWeight: 400, fontSize: 12, lineHeight: 1.45, whiteSpace: 'normal', ...window.dtOverlay.style(v.isOpen) } },
      h('span', { style: { display: 'flex', justifyContent: 'space-between', gap: 8, alignItems: 'baseline', fontFamily: mono, fontSize: 9, letterSpacing: '0.1em', color: 'var(--dt-muted)' } }, h('span', null, v.dirText + ' · ' + v.sheet + (v.cardId ? ' · #' + v.cardId : '')), h('span', { style: { color: v.statusColor, fontWeight: 600, letterSpacing: 0 } }, v.status)),
      h('span', { style: { fontFamily: "'Spectral',serif", fontSize: 14, fontWeight: 600, lineHeight: 1.2 } }, v.title),
      h('span', { style: { color: 'var(--dt-muted)', fontSize: 11.5, lineHeight: 1.45 } }, v.summary),
      h('span', { style: { fontFamily: mono, fontSize: 9, color: 'var(--dt-muted)', borderTop: '1px dashed var(--dt-grid-mid)', paddingTop: 6, lineHeight: 1.5 } }, 'Click to go — the card flashes when you land. Esc closes this preview.'));
  }
  renderVals() {
    const sheet = String(this.props.sheet ?? 'A-01'), cardId = String(this.props.card ?? ''), ph = this.state.phase;
    const HREF = { 'A-01': 'Prototype A - Layout Canvas.dc.html', 'B-01': 'Prototype B - When the AI Isnt Sure.dc.html', 'C-01': 'Prototype C - Measurement to Procurement.dc.html', 'P-01': 'Prototype P - Procurement.dc.html', 'M-01': 'Prototype M - Measure and Check.dc.html', 'F-01': '../F-01 Workbench Junior.dc.html', 'Hub': '../Hub.dc.html' };
    const base = this.props.href ?? (HREF[sheet] || '#'); const href = base + (cardId ? '#' + cardId : '');
    const reg = (window.dtCards || {})[sheet + '#' + cardId] || {};
    const v = {
      anchorRef: this.anchorRef, descId: this._uid, href, sheet, cardId,
      labelText: this.props.label ?? (sheet + ' · ' + (reg.title || cardId || 'sheet')) + (this.props.dir === 'back' ? ' ↖' : ' →'),
      dirText: this.props.dir === 'back' ? 'WHERE IT CAME FROM' : 'WHAT LEANS ON IT',
      title: this.props.title ?? reg.title ?? (cardId || sheet), summary: this.props.summary ?? reg.summary ?? 'No preview registered for this card yet — the host reads the manifest for it.', status: this.props.status ?? reg.status ?? '', statusColor: reg.statusColor || 'var(--dt-muted)',
      isOpen: ph === 'open',
      show: () => this.ov().open(), hideSoon: () => this.ov().close(false), key: (e) => { if (e.key === 'Escape') this.ov().close(true); }
    };
    this._v = v; return v;
  }
}
</script>
</body>
</html>
